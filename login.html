<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Generador de Resúmenes</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="auth-wrap">
    <div class="panel auth-panel">
      <h1>Iniciar sesión</h1>
      <p class="auth-sub">Accedé para ver tus subastas</p>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for m in messages %}
            <div class="auth-flash">{{ m }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" id="login-form">
        <label>Usuario</label>
        <div class="autocomplete-wrapper">
          <div class="autocomplete-ghost" id="ghost-username"></div>
          <input type="text" id="username-input" placeholder="Tu usuario" autocomplete="off" autofocus>
          <input type="hidden" name="username" id="username-hidden">
        </div>

        <label>Contraseña</label>
        <input type="password" name="password" autocomplete="current-password" required>

        <button class="btn btn-primary" type="submit">Ingresar</button>
      </form>

      <div class="auth-link">¿No tenés cuenta? <a href="{{ url_for('registro') }}">Registrate</a></div>
    </div>
  </div>

<script>
  const usuarios = {{ usernames|tojson }};
  const inputEl = document.getElementById('username-input');
  const ghostEl = document.getElementById('ghost-username');
  const hiddenEl = document.getElementById('username-hidden');
  let sugerencia = '';

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function actualizarGhost() {
    const val = inputEl.value;
    sugerencia = '';
    if (!val) { ghostEl.innerHTML = ''; return; }
    const match = usuarios.find(u => u.toLowerCase().startsWith(val.toLowerCase()) && u.length > val.length);
    if (!match) { ghostEl.innerHTML = ''; return; }
    sugerencia = match;
    ghostEl.innerHTML = `<span class="typed">${escapeHtml(match.slice(0, val.length))}</span><span class="suggestion">${escapeHtml(match.slice(val.length))}</span>`;
  }

  inputEl.addEventListener('input', actualizarGhost);
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Tab' && sugerencia) {
      e.preventDefault();
      inputEl.value = sugerencia;
      ghostEl.innerHTML = '';
      sugerencia = '';
    }
    if (e.key === 'Enter') {
      hiddenEl.value = inputEl.value;
    }
  });
  inputEl.addEventListener('blur', () => { ghostEl.innerHTML = ''; sugerencia = ''; });

  document.getElementById('login-form').addEventListener('submit', () => {
    hiddenEl.value = inputEl.value;
  });
</script>
</body>
</html>
