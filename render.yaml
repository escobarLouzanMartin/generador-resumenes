databases:
  - name: generador-resumenes-db
    plan: free

services:
  - type: web
    name: generador-resumenes
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: generador-resumenes-db
          property: connectionString
