<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estadísticas — Generador de Resúmenes</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .evolucion-grafico {
      width: 100%;
      height: 300px;
      display: block;
      margin-top: 10px;
    }

    .evolucion-vacio {
      min-height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 13px;
    }

    .evolucion-linea {
      fill: none;
      stroke: #1d4ed8;
      stroke-width: 3;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .evolucion-area {
      fill: rgba(29, 78, 216, 0.12);
      stroke: none;
    }

    .evolucion-punto {
      fill: #1d4ed8;
    }

    .evolucion-eje {
      stroke: #333;
      stroke-width: 1;
    }

    .evolucion-grid {
      stroke: #222;
      stroke-width: 1;
    }

    .evolucion-texto {
      fill: #777;
      font-size: 11px;
      font-family: Arial, sans-serif;
    }

    .evolucion-tooltip {
      fill: #aaa;
      font-size: 11px;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

{% include '_nav.html' with context %}

<div id="contenido-stats">
  <div class="empty">Cargando estadísticas...</div>
</div>

<script>
  function formatPrecio(n) {
    return '$' + Number(n).toLocaleString('es-AR', {
      minimumFractionDigits: 0,
      maximumFractionDigits: 0
    });
  }

  function crearGraficoEvolucion(evolucion) {
    const contenedor = document.getElementById('grafico-evolucion');

    if (!evolucion || evolucion.length === 0) {
      contenedor.innerHTML =
        '<div class="evolucion-vacio">No hay datos de evolución.</div>';
      return;
    }

    // SVG en lugar de Chart.js: no depende de que una librería externa
    // termine de cargar y evita el problema del canvas creado por innerHTML.
    const width = 760;
    const height = 280;
    const paddingLeft = 62;
    const paddingRight = 24;
    const paddingTop = 20;
    const paddingBottom = 42;

    const valores = evolucion.map(e => Number(e.total) || 0);
    const maximo = Math.max(...valores, 1);

    const anchoGrafico = width - paddingLeft - paddingRight;
    const altoGrafico = height - paddingTop - paddingBottom;

    const x = i => {
      if (evolucion.length === 1) {
        return paddingLeft + anchoGrafico / 2;
      }
      return paddingLeft + (i / (evolucion.length - 1)) * anchoGrafico;
    };

    const y = valor =>
      paddingTop + altoGrafico - (valor / maximo) * altoGrafico;

    const puntos = evolucion.map((e, i) =>
      `${x(i)},${y(Number(e.total) || 0)}`
    ).join(' ');

    const area = [
      `${x(0)},${height - paddingBottom}`,
      ...evolucion.map((e, i) =>
        `${x(i)},${y(Number(e.total) || 0)}`
      ),
      `${x(evolucion.length - 1)},${height - paddingBottom}`
    ].join(' ');

    const lineas = [0, 0.25, 0.5, 0.75, 1].map(fraccion => {
      const valor = maximo * fraccion;
      const yy = y(valor);

      return `
        <line class="evolucion-grid"
              x1="${paddingLeft}" y1="${yy}"
              x2="${width - paddingRight}" y2="${yy}"></line>
        <text class="evolucion-texto"
              x="${paddingLeft - 8}" y="${yy + 4}"
              text-anchor="end">${formatPrecio(valor)}</text>
      `;
    }).join('');

    const etiquetas = evolucion.map((e, i) => `
      <text class="evolucion-texto"
            x="${x(i)}" y="${height - 15}"
            text-anchor="middle">#${e.numero}</text>
    `).join('');

    const puntosSvg = evolucion.map((e, i) => `
      <circle class="evolucion-punto"
              cx="${x(i)}"
              cy="${y(Number(e.total) || 0)}"
              r="5">
        <title>Subasta #${e.numero}: ${formatPrecio(Number(e.total) || 0)}</title>
      </circle>
    `).join('');

    contenedor.innerHTML = `
      <svg class="evolucion-grafico"
           viewBox="0 0 ${width} ${height}"
           preserveAspectRatio="none"
           role="img"
           aria-label="Evolución del total generado por subasta">
        ${lineas}
        <line class="evolucion-eje"
              x1="${paddingLeft}" y1="${height - paddingBottom}"
              x2="${width - paddingRight}" y2="${height - paddingBottom}"></line>
        <polygon class="evolucion-area" points="${area}"></polygon>
        <polyline class="evolucion-linea" points="${puntos}"></polyline>
        ${puntosSvg}
        ${etiquetas}
      </svg>
    `;
  }

  async function cargarEstadisticas() {
    const cont = document.getElementById('contenido-stats');

    try {
      const res = await fetch('/api/estadisticas');

      if (!res.ok) {
        throw new Error('No se pudieron cargar las estadísticas.');
      }

      const data = await res.json();

      if (data.cantidad_subastas === 0) {
        cont.innerHTML =
          '<div class="panel"><div class="empty">' +
          'Todavía no cerraste ninguna subasta. Las estadísticas van a aparecer acá una vez que cierres al menos una.' +
          '</div></div>';
        return;
      }

      cont.innerHTML = `
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Total generado</div>
            <div class="stat-value">${formatPrecio(data.total_generado)}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Subastas cerradas</div>
            <div class="stat-value">${data.cantidad_subastas}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Promedio por subasta</div>
            <div class="stat-value">${formatPrecio(data.promedio_por_subasta)}</div>
          </div>
        </div>

        <div class="stats-panels">
          <div class="panel">
            <h2>Evolución por subasta</h2>
            <div id="grafico-evolucion"></div>
          </div>

          <div class="panel">
            <h2>Compradores más fieles</h2>
            <p style="font-size:12px; color:#666; margin-bottom:8px;">
              Por cantidad de subastas en las que compraron
            </p>
            <div class="top-lista" id="top-frecuencia"></div>

            <h2 style="margin-top:20px;">Compradores que más gastaron</h2>
            <div class="top-lista" id="top-gasto"></div>
          </div>
        </div>
      `;

      const topFrecuenciaEl = document.getElementById('top-frecuencia');

      if (data.top_por_frecuencia.length === 0) {
        topFrecuenciaEl.innerHTML = '<div class="empty">Sin datos aún</div>';
      } else {
        topFrecuenciaEl.innerHTML = data.top_por_frecuencia.map((c, i) => `
          <div class="top-item">
            <span class="rank">#${i + 1}</span>
            <span class="nombre">${c.comprador}</span>
            <span class="valor">
              ${c.subastas} subasta${c.subastas !== 1 ? 's' : ''} · ${formatPrecio(c.gastado)}
            </span>
          </div>
        `).join('');
      }

      const topGastoEl = document.getElementById('top-gasto');

      if (data.top_por_gasto.length === 0) {
        topGastoEl.innerHTML = '<div class="empty">Sin datos aún</div>';
      } else {
        topGastoEl.innerHTML = data.top_por_gasto.map((c, i) => `
          <div class="top-item">
            <span class="rank">#${i + 1}</span>
            <span class="nombre">${c.comprador}</span>
            <span class="valor">${formatPrecio(c.total)}</span>
          </div>
        `).join('');
      }

      crearGraficoEvolucion(data.evolucion);
    } catch (error) {
      cont.innerHTML =
        `<div class="panel"><div class="error-msg">${error.message}</div></div>`;
    }
  }

  cargarEstadisticas();
</script>

<div class="footer">Martín Escobar Louzán · 2026</div>

</body>
</html>
