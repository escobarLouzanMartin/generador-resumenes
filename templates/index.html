<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Resúmenes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 16px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #fff;
    }

    .layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 24px;
      max-width: 1100px;
    }

    .panel {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 20px;
    }

    .panel h2 {
      font-size: 14px;
      font-weight: 500;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
      margin-top: 12px;
    }

    input {
      width: 100%;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #e0e0e0;
      padding: 10px 12px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: #444; }

    .btn {
      width: 100%;
      margin-top: 16px;
      padding: 13px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.85; }

    .btn-primary { background: #1d4ed8; color: #ccc; }
    .btn-danger  { background: #991b1b; color: #ccc; margin-top: 8px; }
    .btn-success { background: #15803d; color: #ccc; margin-top: 8px; }

    .error-msg {
      font-size: 13px;
      color: #ef4444;
      margin-top: 8px;
      min-height: 18px;
    }

    /* Lista de compras cargadas */
    .compras-lista {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 320px;
      overflow-y: auto;
    }

    .compra-item {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .compra-item .info { flex: 1; }
    .compra-item .nombre { font-weight: 500; color: #fff; }
    .compra-item .carta-precio { color: #888; font-size: 12px; margin-top: 2px; }

    .btn-eliminar {
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: 20px;
      padding: 6px 10px;
      border-radius: 6px;
      transition: color 0.2s;
    }
    .btn-eliminar:hover { color: #ef4444; }

    .empty { color: #444; font-size: 13px; text-align: center; padding: 20px 0; }

    /* Resúmenes */
    .resumenes-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .resumen-card {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      overflow: hidden;
    }

    .resumen-header {
      background: #1e1e1e;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2a2a;
    }

    .resumen-nombre { font-weight: 500; font-size: 15px; color: #fff; }

    .resumen-total {
      background: #1d4ed8;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 6px;
      white-space: nowrap;
      margin-left: 8px;
    }

    .resumen-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 16px;
      font-size: 13px;
      border-bottom: 1px solid #1a1a1a;
      gap: 8px;
    }

    .resumen-item:last-child { border-bottom: none; }
    .resumen-item .r-carta { color: #ccc; }
    .resumen-item .r-precio { color: #888; white-space: nowrap; }

    .acciones {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .acciones .btn { margin-top: 0; }

    /* Mobile */
    @media (max-width: 700px) {
      body { padding: 12px; }

      h1 { font-size: 18px; margin-bottom: 16px; }

      .layout {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .panel { padding: 16px; }

      .compras-lista { max-height: 220px; }
    }
  </style>
</head>
<body>

<h1>Generador de Resúmenes de Subasta</h1>

<div class="layout">

  <!-- Panel izquierdo: carga y lista -->
  <div>
    <div class="panel">
      <h2>Cargar compra</h2>
      <label>Comprador</label>
      <input type="text" id="comprador" placeholder="Ej: Ash Ketchum" autocomplete="off">
      <label>Carta</label>
      <input type="text" id="carta" placeholder="Ej: Dark Magician">
      <label>Precio ($)</label>
      <input type="text" id="precio" placeholder="Ej: 1000" id="precio">
      <div class="error-msg" id="error"></div>
      <button class="btn btn-primary" onclick="agregarCompra()">Agregar compra</button>
      <div class="acciones">
        <button class="btn btn-success" onclick="generarResumenes()">Generar resúmenes</button>
        <button class="btn btn-danger" onclick="limpiarTodo()">Limpiar todo</button>
      </div>
    </div>

    <div class="panel" style="margin-top: 16px;">
      <h2>Compras cargadas (<span id="contador">0</span>)</h2>
      <div class="compras-lista" id="compras-lista">
        <div class="empty">Ninguna compra cargada aún</div>
      </div>
    </div>
  </div>

  <!-- Panel derecho: resúmenes -->
  <div class="panel">
    <h2>Resúmenes por comprador</h2>
    <div class="resumenes-grid" id="resumenes">
      <div class="empty">Los resúmenes aparecerán acá una vez que generes</div>
    </div>
  </div>

</div>

<script>
  function formatPrecio(n) {
    return '$' + n.toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  }

  async function agregarCompra() {
    const comprador = document.getElementById('comprador').value.trim();
    const carta = document.getElementById('carta').value.trim();
    const precio = document.getElementById('precio').value.trim();
    const errorEl = document.getElementById('error');

    errorEl.textContent = '';

    if (!comprador || !carta || !precio) {
      errorEl.textContent = 'Completá todos los campos.';
      return;
    }

    const res = await fetch('/agregar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ comprador, carta, precio })
    });

    const data = await res.json();

    if (!res.ok) {
      errorEl.textContent = data.error;
      return;
    }

    document.getElementById('carta').value = '';
    document.getElementById('precio').value = '';
    const esMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
    if (!esMobile) document.getElementById('carta').focus();

    await cargarCompras();
  }

  async function cargarCompras() {
    const res = await fetch('/compras');
    const compras = await res.json();

    document.getElementById('contador').textContent = compras.length;
    const lista = document.getElementById('compras-lista');

    if (compras.length === 0) {
      lista.innerHTML = '<div class="empty">Ninguna compra cargada aún</div>';
      return;
    }

    lista.innerHTML = compras.map((c, i) => `
      <div class="compra-item">
        <div class="info">
          <div class="nombre">${c.comprador}</div>
          <div class="carta-precio">${c.carta} · ${formatPrecio(c.precio)}</div>
        </div>
        <button class="btn-eliminar" onclick="eliminar(${i})" title="Eliminar">✕</button>
      </div>
    `).join('');
  }

  async function eliminar(idx) {
    await fetch('/eliminar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ index: idx })
    });
    await cargarCompras();
  }

  async function generarResumenes() {
    const res = await fetch('/resumenes');
    const resumenes = await res.json();

    const el = document.getElementById('resumenes');

    if (resumenes.length === 0) {
      el.innerHTML = '<div class="empty">No hay compras cargadas</div>';
      return;
    }

    const totalGeneral = resumenes.reduce((acc, r) => acc + r.total, 0);

    el.innerHTML = resumenes.map(r => `
      <div class="resumen-card">
        <div class="resumen-header">
          <span class="resumen-nombre">${r.comprador}</span>
          <span class="resumen-total">Total: ${formatPrecio(r.total)}</span>
        </div>
        ${r.items.map(i => `
          <div class="resumen-item">
            <span class="r-carta">${i.carta}</span>
            <span class="r-precio">${formatPrecio(i.precio)}</span>
          </div>
        `).join('')}
      </div>
    `).join('') + `
      <div style="background:#1e1e1e; border:1px solid #2a2a2a; border-radius:10px; padding:12px 16px; display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:14px; font-weight:500; color:#fff;">Total generado</span>
        <span style="background:#1d4ed8; color:#fff; font-size:14px; font-weight:600; padding:5px 12px; border-radius:6px;">${formatPrecio(totalGeneral)}</span>
      </div>
    `;
  }

  async function limpiarTodo() {
    if (!confirm('¿Seguro que querés limpiar todas las compras?')) return;
    await fetch('/limpiar', { method: 'POST' });
    await cargarCompras();
    document.getElementById('resumenes').innerHTML = '<div class="empty">Los resúmenes aparecerán acá una vez que generes</div>';
  }

  // Enter en precio dispara agregar
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('precio').addEventListener('keydown', e => {
      if (e.key === 'Enter') agregarCompra();
    });
    document.getElementById('carta').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('precio').focus();
    });
    document.getElementById('comprador').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('carta').focus();
    });
  });
</script>

</body>
</html>
